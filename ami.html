<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Zarin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS STYLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* BACKGROUND UPDATE:
               I changed the opacity to 0.4 (40%). 
               This makes the black overlay much lighter, so 'jebu.jpeg' is very visible.
            */
            background: linear-gradient(rgba(0, 10, 20, 0.4), rgba(0, 0, 0, 0.4)), url('jebu.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: white;
            overflow: hidden;
        }

        .container {
            z-index: 1;
            text-align: center;
            /* Made the box slightly darker/stronger so text is readable over the bright picture */
            background: rgba(0, 15, 30, 0.65); 
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 95%;
            width: 700px;
        }

        /* 1. Main Title: Missing my home ( Zarin ) */
        .main-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 700; /* Bold */
            font-size: 2.5rem;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.8);
            margin-bottom: 5px;
            line-height: 1.2;
        }

        /* 2. Subtitle: Counting seconds until */
        .sub-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 300; /* Light/Thin */
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #00d2ff; /* Cyan Neon */
            margin-bottom: 20px;
        }

        .last-seen {
            font-size: 0.9rem;
            color: #cfd8dc;
            margin-bottom: 35px;
            font-weight: 400;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.1);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 50px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .time-box {
            /* Semi-transparent dark box for numbers */
            background: rgba(0, 0, 0, 0.5);
            padding: 20px 15px;
            border-radius: 12px;
            min-width: 85px;
            border-bottom: 3px solid #00d2ff;
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite ease-in-out;
        }
        
        .time-box span {
            display: block;
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
        }

        .time-box small {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #00d2ff;
            letter-spacing: 1px;
            margin-top: 5px;
            display: block;
        }

        .message {
            font-size: 1.1rem;
            color: #e6f1ff;
            font-weight: 300;
            margin-top: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            .countdown { gap: 10px; }
            .time-box { min-width: 70px; padding: 10px; }
            .time-box span { font-size: 1.8rem; }
            .main-title { font-size: 1.8rem; }
            .sub-title { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <h1 class="main-title">Missing my home ( Zarin )</h1>
        <h2 class="sub-title">Counting seconds until</h2>
        
        <div class="last-seen">
            Last seen: 28/12/2025 at 3:26 PM
        </div>

        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <small>Days</small>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>
        </div>

        <p class="message">See you on January 10th 💙</p>
    </div>

    <script>
        // JAVASCRIPT LOGIC
        
        // Target Date: January 10, 2026 at 10:00 AM
        const reunionDate = new Date("January 10, 2026 10:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = reunionDate - now;

            // Calculations
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Update HTML
            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            // When countdown finishes
            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".container").innerHTML = `
                    <h1 class="main-title" style="color:#00d2ff;">Zarin is finally here!</h1>
                    <h2 class="sub-title" style="color:#fff;">Together Again 💙</h2>
                `;
            }
        }, 1000);
    </script>
</body>
</html>
